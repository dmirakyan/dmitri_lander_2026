name: Legacy GitHub Pages (manual rollback)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Stage only public website files
        run: |
          mkdir -p _site/admin
          cp index.html CNAME robots.txt sitemap.xml .nojekyll _site/
          cp -R assets blog dates _site/
          cp admin/index.html admin/admin.css admin/admin.js _site/admin/
          test -z "$(find _site -type l -print -quit)"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
